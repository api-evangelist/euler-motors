aid: euler-motors
name: Euler Motors
description: 'Euler Motors is an Indian electric commercial vehicle manufacturer headquartered
  in New Delhi, building battery-electric cargo and light commercial vehicles for last-mile
  logistics — the HiLoad and Turbo electric three-wheelers and the Storm EV four-wheeler
  light commercial vehicle range. Alongside the vehicles the company operates Euler Shepherd,
  a connected-vehicle telematics platform delivered as two end-user products: Shepherd Lite
  (a mobile app for real-time vehicle location, battery state of charge, range, charging
  status and alerts) and Shepherd Enterprise (a browser-based fleet console with trip,
  utilization and operations reporting). Euler Motors publishes no public developer program:
  there is no developer portal, API reference, OpenAPI/AsyncAPI specification, SDK, webhook
  catalog or partner integration documentation on any host it controls. The Shepherd web
  console is a single-page application whose backend answers anonymous requests with 403,
  so the telematics data surface is reachable only to vehicle owners inside the product.
  The company does publish an llms.txt at its web root, directing AI crawlers to its
  product, service-network and blog pages.'
